[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real2sim-workbench"
version = "0.1.0"
description = "Human-assisted image-to-physics scene reconstruction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.18", "pillow>=11", "numpy>=2", "scipy>=1.14", "trimesh>=4.5", "mujoco>=3.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
real2sim = "real2sim_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
real2sim_workbench = ["web/*", "web/vendor/*"]
